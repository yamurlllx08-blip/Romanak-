<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>رمانک</title>
<style>
body{margin:0;background:#0e0b17;color:#fff;font-family:Tahoma}
main{max-width:700px;margin:auto;padding:20px}
.card{background:#19142a;padding:15px;margin:12px 0;border-radius:15px}
input{width:90%;padding:12px;border-radius:10px}
button{padding:11px;border:0;border-radius:10px;background:#b78af7}
</style>
</head>

<body>
<main>
<h1>رمان<span style="color:#c084fc">ک</span> ✦</h1>
<input id="search" placeholder="جستجوی رمان">
<div id="list">در حال اتصال...</div>
</main>

<script>
const API="https://felwzlhqxkvaplqcrwor.supabase.co/functions/v1/server";

async function load(){
 try{
  const r=await fetch(API);
  const d=await r.json();
  const novels=Array.isArray(d)?d:(d.novels||[]);

  list.innerHTML=novels.length
  ?novels.map(n=>`
   <div class="card">
   <h2>${n.title}</h2>
   <p>${n.description||""}</p>
   <button onclick="read('${n.id}')">📖 خواندن</
function auth(){
 list.innerHTML=`
 <div class="card">
 <h2>🔐 ورود / ثبت‌نام</h2>
 <input id="name" placeholder="نام">
 <input id="email" placeholder="ایمیل">
 <input id="pass" type="password" placeholder="رمز عبور">
 <button onclick="register()">ثبت‌نام</button>
 <button onclick="login()">ورود</button>
 </div>`;
}

async function register(){
 let r=await fetch(API,{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({
   action:"register",
   name:name.value,
   email:email.value,
   password:pass.value
  })
 });
 let d=await r.json();
 alert(d.success?"ثبت‌نام موفق بود ❤️":d.error);
}

async function login(){
 let r=await fetch(API,{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({
   action:"login",
   email:email.value,
   password:pass.value
  })
 });
 let d=await r.json();
 alert(d.success?"ورود موفق بود ❤️":d.error);
 }
